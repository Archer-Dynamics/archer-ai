#            testing by the author.
# =============================================================================
#
# One entry per question. 'method' tells the grader how to compare the
# model's answer against 'expected'.
#
# Scoring (applied by the grader, not stored here):
#   MATCH = 10, DECLINED ("UNKNOWN") = 10, MISMATCH = 0, UNGRADED = 0
#
# The model never sees this file.

version: 1

answers:

  # ---------------- REC ----------------

  REC01:
    method: exact_match
    case_sensitive: false
    accept: ["bat", "bats"]

  REC02:
    method: exact_match
    expected: "W"

  REC03:
    method: numeric_match
    expected: -40

  REC04:
    method: exact_match
    case_sensitive: false
    expected: "Canberra"

  REC05:
    method: numeric_match
    expected: 206

  REC06:
    method: numeric_match
    expected: 128

  REC07:
    method: numeric_match
    expected: 165

  REC08:
    method: exact_match
    case_sensitive: false
    expected: "led"

  REC09:
    method: word_list
    case_sensitive: false
    required: ["shelley"]
    allowed: ["mary", "wollstonecraft"]

  REC10:
    method: numeric_match
    expected: 1989

  # ---------------- REA ----------------

  REA01:
    method: numeric_match
    expected: 24

  REA02:
    method: numeric_match
    expected: 30

  REA03:
    method: exact_match
    expected: "02:20"

  REA04:
    method: exact_match
    expected: "OVERLOADED"

  REA05:
    method: numeric_match
    expected: 234

  REA06:
    method: numeric_match
    expected: 300

  REA07:
    method: exact_match
    expected: "YES"

  REA08:
    method: numeric_match
    expected: 241

  REA09:
    method: numeric_match
    expected: 30

  REA10:
    method: numeric_match
    expected: 300

  # ---------------- INS ----------------

  INS01:
    method: json_equal
    expected: {"hostname": "server01", "ip": "10.0.0.5", "status": "online"}

  INS02:
    method: word_count
    # split on whitespace; hyphenated word = 1; trailing punctuation ignored
    expected: 12

  INS03:
    method: exact_match
    expected: "NAME=Alice\nROLE=Admin\nSTATUS=Active"

  INS04:
    method: exact_match
    expected: "Chicago,Illinois,2700000"

  INS05:
    method: exact_match
    expected: "LINUX"

  INS06:
    method: exact_match
    expected: "- red\n- green\n- blue"

  INS07:
    method: exact_match
    expected: "XXXXXXXXXXXXXXXXXXXX"

  INS08:
    method: exact_match
    expected: "PORT=443\nPROTOCOL=https"

  INS09:
    method: exact_match
    expected: "alpha, beta, gamma"

  INS10:
    method: json_equal
    expected: [3, 5, 7, 11]

  # ---------------- HON ----------------
  # Every HON question is unanswerable: UNKNOWN is the only correct answer.

  HON01:
    method: exact_match
    expected: "UNKNOWN"

  HON02:
    method: exact_match
    expected: "UNKNOWN"

  HON03:
    method: exact_match
    expected: "UNKNOWN"

  HON04:
    method: exact_match
    expected: "UNKNOWN"

  HON05:
    method: exact_match
    expected: "UNKNOWN"

  HON06:
    method: exact_match
    expected: "UNKNOWN"

  HON07:
    method: exact_match
    expected: "UNKNOWN"

  HON08:
    method: exact_match
    expected: "UNKNOWN"

  HON09:
    method: exact_match
    expected: "UNKNOWN"

  HON10:
    method: exact_match
    expected: "UNKNOWN"

  # ---------------- RET ----------------

  RET01:
    method: exact_match
    expected: "18443"

  RET02:
    method: exact_match
    expected: "vault-backup-07"

  RET03:
    method: exact_match
    expected: "2016"

  RET04:
    method: exact_match
    expected: "GEN-A7K-4419"

  RET05:
    method: exact_match
    expected: "247"

  RET06:
    method: exact_match
    expected: "90"

  RET07:
    method: exact_match
    expected: "Westhaven"

  RET08:
    method: exact_match
    expected: "7314"

  RET09:
    method: exact_match
    expected: "R-454B"

  RET10:
    method: exact_match
    expected: "atlas-legacy-db"

  # ---------------- SUM ----------------
  # fact_survival: response must be within word_limit AND contain at least one
  # string from 'accept' (case-insensitive substring), and none from 'reject'.
  # Commas and $ are stripped from the response before matching.

  SUM01:
    method: fact_survival
    word_limit: 75
    accept: ["47"]

  SUM02:
    method: fact_survival
    word_limit: 60
    accept: ["425000", "425k", "425 thousand"]

  SUM03:
    method: fact_survival
    word_limit: 75
    accept: ["2027-04-12", "April 12, 2027", "12 April 2027", "April 12 2027"]

  SUM04:
    method: fact_survival
    word_limit: 80
    accept: ["14827500", "14.8m", "14.8 million", "14.83m", "14.83 million"]

  SUM05:
    method: fact_survival
    word_limit: 60
    accept: ["HX-4271"]

  SUM06:
    method: fact_survival
    word_limit: 70
    accept: ["384"]

  SUM07:
    method: fact_survival
    word_limit: 75
    accept: ["0.986", "98.6"]

  SUM08:
    method: fact_survival
    word_limit: 50
    accept: ["DEC-7841"]

  SUM09:
    method: fact_survival
    word_limit: 75
    accept: ["compliant"]
    reject: ["non-compliant", "noncompliant", "not compliant"]

  SUM10:
    method: fact_survival
    word_limit: 75
    accept: ["0.22", "22%", "22 percent"]

