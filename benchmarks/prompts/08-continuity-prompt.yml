#
# Model-facing prompts for the 10 CON questions. The runner pastes the
# listed conversation script after the prompt and appends the UNKNOWN
# escape clause. Prompts are deliberately neutral: they must not say
# whether a value changed. Expected answers live in non-cod-answer-key.yml.

version: 1

questions:

  - id: CON01

    category: CON

    skill: Value replacement

    scenario: Corrected account balance

    prompt: |
      Based on the conversation below, what is the
      account balance?

      Answer with digits only.

    trap: >
      Uses the original value instead of
      the corrected value.

    resource_ids:
      - con-script-01.yml

    output_contract:
      type: integer
      format: digits_only

    grading:
      method: exact_match

  - id: CON02

    category: CON

    skill: Address update

    scenario: Current customer city

    prompt: |
      Based on the conversation below, what city
      does the customer live in?

      Answer with the city name only.

    trap: >
      Retains the earlier city value.

    resource_ids:
      - con-script-02.yml

    output_contract:
      type: token
      format: single_word_exact

    grading:
      method: exact_match

  - id: CON03

    category: CON

    skill: Inventory update

    scenario: Corrected stock quantity

    prompt: |
      Based on the conversation below, what is the
      stock quantity?

      Answer with digits only.

    trap: >
      Uses the initial quantity rather than
      the corrected quantity.

    resource_ids:
      - con-script-03.yml

    output_contract:
      type: integer
      format: digits_only

    grading:
      method: exact_match

  - id: CON04

    category: CON

    skill: Stable hostname control

    scenario: Unchanged hostname

    prompt: |
      Based on the conversation below, what is the
      hostname?

      Answer with the hostname only.

    trap: >
      Assumes a correction occurred even though
      none was made.

    resource_ids:
      - con-script-04.yml

    output_contract:
      type: hostname
      format: exact

    grading:
      method: exact_match

  - id: CON05

    category: CON

    skill: Meeting reschedule

    scenario: Final meeting start time

    prompt: |
      Based on the conversation below, what time
      does the meeting start?

      Answer in 24-hour HH:MM format only.

    trap: >
      Uses an intermediate time instead of
      the final scheduled time.

    resource_ids:
      - con-script-05.yml

    output_contract:
      type: time
      format: hhmm_24

    grading:
      method: exact_match

  - id: CON06

    category: CON

    skill: Contact replacement

    scenario: Final primary contact

    prompt: |
      Based on the conversation below, what is the
      primary contact's email address?

      Answer with the email address only.

    trap: >
      Uses the original contact instead of
      the replacement.

    resource_ids:
      - con-script-06.yml

    output_contract:
      type: email
      format: exact

    grading:
      method: exact_match

  - id: CON07

    category: CON

    skill: Price adjustment

    scenario: Final product price

    prompt: |
      Based on the conversation below, what is the
      product price?

      Answer with digits only.

    trap: >
      Uses an older price or performs
      unnecessary arithmetic.

    resource_ids:
      - con-script-07.yml

    output_contract:
      type: integer
      format: digits_only

    grading:
      method: exact_match

  - id: CON08

    category: CON

    skill: Configuration change

    scenario: Current network port assignment

    prompt: |
      Based on the conversation below, what network
      port is assigned?

      Answer with digits only.

    trap: >
      Retains the previous configuration value.

    resource_ids:
      - con-script-08.yml

    output_contract:
      type: integer
      format: digits_only

    grading:
      method: exact_match

  - id: CON09

    category: CON

    skill: Stable tracking ID control

    scenario: Unchanged tracking identifier

    prompt: |
      Based on the conversation below, what is the
      tracking ID?

      Answer with the ID only.

    trap: >
      Assumes an update occurred even though
      the identifier never changed.

    resource_ids:
      - con-script-09.yml

    output_contract:
      type: token
      format: exact

    grading:
      method: exact_match

  - id: CON10

    category: CON

    skill: Stable owner control

    scenario: Unchanged account owner

    prompt: |
      Based on the conversation below, what is the
      account owner ID?

      Answer with the ID only.

    trap: >
      Replaces an unchanged value with
      an invented update.

    resource_ids:
      - con-script-10.yml

    output_contract:
      type: token
      format: exact

    grading:
      method: exact_match