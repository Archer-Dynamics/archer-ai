#
# Model-facing prompts for the 10 RET questions. The runner pastes the
# listed resource file after the prompt and appends the UNKNOWN escape
# clause. Expected answers live in non-cod-answer-key.yml.

version: 1

questions:

  - id: RET01

    category: RET

    skill: Deep lookup

    scenario: Project Mercury TCP port

    prompt: |
      What TCP port does Project Mercury listen on?

      Answer with digits only.

    trap: >
      Similar port numbers appear elsewhere in the document.

    resource_ids:
      - ret-doc-01.txt

    output_contract:
      type: integer
      format: digits_only

    grading:
      method: exact_match

  - id: RET02

    category: RET

    skill: Deep lookup

