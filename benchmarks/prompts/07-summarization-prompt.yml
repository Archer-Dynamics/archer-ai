version: 1

questions:

  - id: SUM01

    category: SUM

    skill: Incident summary

    scenario: Preserve outage duration in incident report summary

    prompt: |
      Summarize this incident report in no more than
      75 words.

    trap: >
      Omitting the planted outage duration fact.

    resource_ids:
      - SUM-DOC-01

    word_limit: 75

    output_contract:
      type: summary
      format: max_75_words

    grading:
      method: fact_survival

